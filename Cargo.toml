[package]
name = "invert"
version = "0.1.1"
edition = "2024"
description = "Invert files byte-for-byte and inspect inverted file signatures"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
glob = "0.3"
infer = "0.22"
thiserror = "2"

[dev-dependencies]
clap_mangen = "0.2"
tempfile = "3"
